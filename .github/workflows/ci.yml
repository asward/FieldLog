name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (host tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: fmt
        working-directory: core
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: core
        run: cargo test

  android:
    name: Android (cross-compile core + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Select NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler errors as annotations (readable without log access).
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          { grep -E '^e: |error:|error\[|FAILURE|What went wrong' -A3 "$log" | head -c 30000; echo; echo '--- tail ---'; tail -c 20000 "$log"; } > "$RUNNER_TEMP/errors.txt"
          msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/errors.txt" | sed -e ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
          echo "::error title=Android build failed::$msg"
      - name: Check native libs are packaged
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libfieldlog_core.so'
      - uses: actions/upload-artifact@v4
        with:
          name: fieldlog-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
