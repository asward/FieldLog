[workspace]
members = [".", "uniffi-bindgen"]
resolver = "2"

[package]
name = "fieldlog-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared FieldLog core: vaults, git, entry format, session engine, search, images, S3."

[lib]
name = "fieldlog_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "ssh", "https", "vendored-openssl"] }
uniffi = { version = "0.32" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
getrandom = "0.3"
walkdir = "2"
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
